[project]
name = "astra-video-editor"
version = "0.7.0.dev0"
description = "Offline-first desktop video editor"
requires-python = ">=3.12,<3.15"
dependencies = ["PySide6==6.11.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

